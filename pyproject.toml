[project]
name = "agents"
version = "0.1.0"
description = "Playing with AI agents"
readme = "README.md"
authors = [
    { name = "Evan Kuhn" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.2",
    "rich>=14.0.0",
]

[project.scripts]
agent = "agents.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
