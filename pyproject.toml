[project]
name = "agents"
version = "0.1.0"
description = "Playing with AI agents"
readme = "README.md"
authors = [
    { name = "Evan Kuhn" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.2",
    "rich>=14.0.0",
]

[project.scripts]
agent = "agents.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
# ruff also formats Python code blocks in Markdown; leave hand-written journal entries alone
exclude = ["journal/**"]
